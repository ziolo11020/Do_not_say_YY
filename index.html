<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nie nów Yyy </title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }

        .container {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 320px;
        }

        .hidden {
            display: none !important;
        }

        /* Sekcja słów */
        .words-container {
            font-size: 28px;
            font-weight: bold;
            color: #2c3e50;
            margin: 20px 0;
            min-height: 40px;
        }

        /* Stoper / Odliczanie */
        .timer-container {
            font-size: 20px;
            margin: 15px 0;
            color: #555;
        }

        .timer-number {
            font-size: 32px;
            font-weight: bold;
            color: #e74c3c;
        }

        /* Przyciski */
        .btn-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-start {
            background-color: #2ecc71;
            color: white;
        }
        .btn-start:hover { background-color: #27ae60; }

        .btn-restart {
            background-color: #3498db;
            color: white;
        }
        .btn-restart:hover { background-color: #2980b9; }

        .btn-end {
            background-color: #e74c3c;
            color: white;
        }
        .btn-end:hover { background-color: #c0392b; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Przycisk START (widoczny na początku) -->
        <button id="start-btn" class="btn-start" onclick="startProcess()">START</button>

        <!-- Główna zawartość gry (ukryta na początku) -->
        <div id="game-area" class="hidden">
            <div id="words" class="words-container"></div>
            
            <div class="timer-container">
                <span id="timer-label">Zapoznaj się ze słowami:</span>
                <div id="timer" class="timer-number">3</div>
            </div>

            <!-- Przyciski nawigacyjne -->
            <div class="btn-list">
                <button class="btn-restart" onclick="startProcess()">RESTART</button>
                <button class="btn-end" onclick="endGame()">KONIEC</button>
            </div>
        </div>
    </div>

    <script>
        // Baza słów do wylosowania (możesz dodać własne!)
        const wordList = [
            "Jabłko", "Komputer", "Książka", "Telefon", "Samochód", 
            "Drzewo", "Słońce", "Rzeka", "Zegarek", "Kawa", 
            "Pies", "Kot", "Dom", "Góra", "Morze", 
            "Muzyka", "Rower", "Chmura", "Księżyc", "Ogród"
        ];

        let countdownInterval = null;

        // Funkcja losująca dwa różne słowa
        function getRandomWords() {
            const shuffled = [...wordList].sort(() => 0.5 - Math.random());
            return `${shuffled[0]} - ${shuffled[1]}`;
        }

        // Główna funkcja uruchamiająca (Start / Restart)
        function startProcess() {
            // Czyszczenie poprzedniego odliczania, jeśli działało
            clearInterval(countdownInterval);

            // Pokazanie panelu z grą, ukrycie głównego przycisku Start
            document.getElementById('start-btn').classList.add('hidden');
            document.getElementById('game-area').classList.remove('hidden');

            // Wylosowanie i wyświetlenie 2 słów
            document.getElementById('words').textContent = getRandomWords();

            // Etap 1: 3 sekundy na zapoznanie się
            let prepareTime = 3;
            const timerEl = document.getElementById('timer');
            const labelEl = document.getElementById('timer-label');
            
            labelEl.textContent = "Zapoznaj się ze słowami:";
            timerEl.textContent = prepareTime;

            countdownInterval = setInterval(() => {
                prepareTime--;
                timerEl.textContent = prepareTime;

                if (prepareTime <= 0) {
                    clearInterval(countdownInterval);
                    startMainTimer(); // Przejście do głównego odliczania 45s
                }
            }, 1000);
        }

        // Odliczanie główne (45 sekund)
        function startMainTimer() {
            let mainTime = 45;
            const timerEl = document.getElementById('timer');
            const labelEl = document.getElementById('timer-label');

            labelEl.textContent = "Czas gry:";
            timerEl.textContent = mainTime;

            countdownInterval = setInterval(() => {
                mainTime--;
                timerEl.textContent = mainTime;

                if (mainTime <= 0) {
                    clearInterval(countdownInterval);
                    labelEl.textContent = "Czas minął!";
                    timerEl.textContent = "STOP";
                }
            }, 1000);
        }

        // Funkcja resetująca stronę do stanu początkowego (Koniec)
        function endGame() {
            clearInterval(countdownInterval);
            document.getElementById('game-area').classList.add('hidden');
            document.getElementById('start-btn').classList.remove('hidden');
        }
    </script>

</body>
</html>

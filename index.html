    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }

        .container {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 320px;
        }

        .hidden {
            display: none !important;
        }

        /* Sekcja słów */
        .words-container {
            font-size: 28px;
            font-weight: bold;
            color: #2c3e50;
            margin: 20px 0;
            min-height: 40px;
        }

        /* Stoper / Odliczanie */
        .timer-container {
            font-size: 20px;
            margin: 15px 0;
            color: #555;
        }

        .timer-number {
            font-size: 32px;
            font-weight: bold;
            color: #e74c3c;
        }

        /* Przyciski */
        .btn-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-start {
            background-color: #2ecc71;
            color: white;
        }
        .btn-start:hover { background-color: #27ae60; }

        .btn-restart {
            background-color: #3498db;
            color: white;
        }
        .btn-restart:hover { background-color: #2980b9; }

        .btn-end {
            background-color: #e74c3c;
            color: white;
        }
        .btn-end:hover { background-color: #c0392b; }
    </style>

        // System synth/odwarzania dźwięków przez Web Audio API
        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        // Dźwięk pikania (3, 2, 1)
        function playBeep() {
            const ctx = getAudioContext();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, ctx.currentTime); // Wysokie A (880Hz)
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);

            osc.connect(gain);
            gain.connect(ctx.destination);

            osc.start();
            osc.stop(ctx.currentTime + 0.15);
        }

        

        // Dźwięk końcowego dzwonka / gongu
        function playBell() {
            const ctx = getAudioContext();
            
            // Dwa połączone tony tworzące przyjemne brzmienie dzwonka
            [523.25, 659.25, 783.99].forEach((freq) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 1.8);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start();
                osc.stop(ctx.currentTime + 1.8);
            });
        }

        let countdownInterval = null;

        function getRandomWords() {
            const shuffled = [...wordList].sort(() => 0.5 - Math.random());
            return `${shuffled[0]} - ${shuffled[1]}`;
        }

        function startProcess() {
            clearInterval(countdownInterval);

            document.getElementById('start-btn').classList.add('hidden');
            document.getElementById('game-area').classList.remove('hidden');

            document.getElementById('words').textContent = getRandomWords();

            let prepareTime = 3;
            const timerEl = document.getElementById('timer');
            const labelEl = document.getElementById('timer-label');
            
            labelEl.textContent = "Zapoznaj się ze słowami:";
            timerEl.textContent = prepareTime;
            
            // Dźwięk na starcie odliczania (3)
            playBeep();

            countdownInterval = setInterval(() => {
                prepareTime--;
                timerEl.textContent = prepareTime;

                if (prepareTime > 0) {
                    playBeep(); // Dźwięk przy 2 i 1
                } else {
                    clearInterval(countdownInterval);
                    startMainTimer(); // Przejście do głównego czasu
                }
            }, 1000);
        }

        function startMainTimer() {
            let mainTime = 45;
            const timerEl = document.getElementById('timer');
            const labelEl = document.getElementById('timer-label');

            labelEl.textContent = "Czas gry:";
            timerEl.textContent = mainTime;
            playTick();

            countdownInterval = setInterval(() => {
                mainTime--;
                timerEl.textContent = mainTime;

                if (mainTime > 0) {
                    playTick(); // Tykanie przy każdej sekundzie
                } else {
                    clearInterval(countdownInterval);
                    labelEl.textContent = "Czas minął!";
                    timerEl.textContent = "STOP";
                    playBell(); // Dzwonek na koniec
                }
            }, 1000);
        }

        function endGame() {
            clearInterval(countdownInterval);
            document.getElementById('game-area').classList.add('hidden');
            document.getElementById('start-btn').classList.remove('hidden');
        }

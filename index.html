<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nie mów Yyy</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            padding: 20px;
        }

        .main-wrapper {
            display: flex;
            flex-direction: row;
            gap: 20px;
            max-width: 800px;
            width: 100%;
            justify-content: center;
            align-items: flex-start;
        }

        @media (max-width: 650px) {
            .main-wrapper {
                flex-direction: column;
                align-items: center;
            }
        }

        .container {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 340px;
            flex-shrink: 0;
        }

        .scoreboard-container {
            background-color: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 300px;
            flex-shrink: 0;
        }

        .hidden {
            display: none !important;
        }

        h2, h3 {
            margin-top: 0;
            color: #2c3e50;
        }

        /* Ekran konfiguracyjny */
        .mode-selection {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .mode-btn {
            flex: 1;
            padding: 10px;
            background-color: #e0e0e0;
            color: #333;
            border: 2px solid transparent;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .mode-btn.active {
            background-color: #e8f4fd;
            border-color: #3498db;
            color: #3498db;
        }

        .input-group {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        .btn-add {
            background-color: #2ecc71;
            color: white;
            padding: 10px 15px;
        }

        .player-list-setup {
            list-style: none;
            padding: 0;
            margin: 15px 0;
            max-height: 150px;
            overflow-y: auto;
            text-align: left;
        }

        .player-list-setup li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            background: #f8f9fa;
            border-radius: 4px;
            margin-bottom: 5px;
        }

        .btn-remove {
            background: none;
            border: none;
            color: #e74c3c;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            padding: 0 5px;
        }

        /* Sekcja słów i stopera */
        .words-container {
            font-size: 26px;
            font-weight: bold;
            color: #2c3e50;
            margin: 20px 0;
            min-height: 40px;
        }

        .timer-container {
            font-size: 18px;
            margin: 15px 0;
            color: #555;
        }

        .timer-number {
            font-size: 32px;
            font-weight: bold;
            color: #e74c3c;
        }

        /* Przyciski */
        .btn-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .btn-primary {
            background-color: #3498db;
            color: white;
            width: 100%;
        }

        .btn-start {
            background-color: #2ecc71;
            color: white;
            width: 100%;
        }

        .btn-restart {
            background-color: #3498db;
            color: white;
        }

        .btn-end {
            background-color: #e74c3c;
            color: white;
        }

        /* Tabelka wyników po boku */
        .score-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }

        .score-name {
            font-weight: bold;
            color: #333;
            max-width: 120px;
            word-wrap: break-word;
            text-align: left;
        }

        .score-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .score-val {
            font-size: 18px;
            font-weight: bold;
            min-width: 25px;
            text-align: center;
        }

        .btn-score {
            width: 32px;
            height: 32px;
            padding: 0;
            border-radius: 50%;
            font-size: 18px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-plus { background-color: #2ecc71; color: white; }
        .btn-minus { background-color: #e74c3c; color: white; }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <!-- Główny kontener gry -->
        <div class="container">
            
            <!-- EKRAN 1: Ustawienia gry -->
            <div id="setup-screen">
                <h2>Ustawienia Gry</h2>
                
                <div class="mode-selection">
                    <button id="mode-team-btn" class="mode-btn active" onclick="setGameMode('team')">Drużynowa</button>
                    <button id="mode-ind-btn" class="mode-btn" onclick="setGameMode('individual')">Indywidualna</button>
                </div>

                <div class="input-group">
                    <input type="text" id="player-input" placeholder="Nazwa drużyny..." onkeydown="if(event.key==='Enter') addParticipant()">
                    <button class="btn-add" onclick="addParticipant()">+</button>
                </div>

                <ul id="setup-participant-list" class="player-list-setup"></ul>

                <button class="btn-primary" onclick="confirmSetup()">Dalej</button>
            </div>

            <!-- EKRAN 2: Przycisk START -->
            <div id="start-screen" class="hidden">
                <h2>Gotowi?</h2>
                <button class="btn-start" onclick="startProcess()">START</button>
            </div>

            <!-- EKRAN 3: Aktywna gra -->
            <div id="game-area" class="hidden">
                <div id="words" class="words-container"></div>
                
                <div class="timer-container">
                    <span id="timer-label">Zapoznaj się ze słowami:</span>
                    <div id="timer" class="timer-number">3</div>
                </div>

                <div class="btn-list">
                    <button class="btn-restart" onclick="startProcess()">RESTART</button>
                    <button class="btn-end" onclick="endGame()">ZAKOŃCZ GRĘ</button>
                </div>
            </div>

        </div>

        <!-- Panel punktacji (po boku) -->
        <div id="scoreboard-panel" class="scoreboard-container hidden">
            <h3>Punktacja</h3>
            <div id="scoreboard-list"></div>
        </div>
    </div>

    <script>
        // Stan aplikacji
        let gameMode = 'team'; // 'team' lub 'individual'
        let participants = []; // { name: string, score: number }
        let countdownInterval = null;

        // Web Audio API
        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function playBeep() {
            const ctx = getAudioContext();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, ctx.currentTime);
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);

            osc.connect(gain);
            gain.connect(ctx.destination);

            osc.start();
            osc.stop(ctx.currentTime + 0.15);
        }

        function playBell() {
            const ctx = getAudioContext();
            [523.25, 659.25, 783.99].forEach((freq) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 1.8);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start();
                osc.stop(ctx.currentTime + 1.8);
            });
        }

        // Baza słów
        const wordList = [
            "Komputer", "Monitor", "Klawiatura", "Myszka", "Drukarka", "Głośnik", "Mikrofon", "Aparat", "Bateria", "Ładowarka",
            "Latarka", "Żarówka", "Gniazdko", "Włącznik", "Silnik", "Hamulec", "Kierownica", "Pasek", "Guzik", "Zamek",
            "Kieszeń", "Rękaw", "Kołnierz", "Parasol", "Walizka", "Plecak", "Paszport", "Dowód", "Portfel", "Gotówka",
            "Moneta", "Rachunek", "Paragon", "Prezent", "Wstążka", "Paczka", "Koperta", "Pocztówka", "Kalendarz", "Zegarek",
            "Budzik", "Minutnik", "Termometr", "Strzykawka", "Bandaż", "Lekarz", "Szpital", "Apteka", "Tabletka", "Recepta",
            "Pielęgniarka", "Pacjent", "Karetka", "Strażak", "Policjant", "Kierowca", "Pilot", "Kapitan", "Żołnierz", "Nauczyciel",
            "Uczeń", "Student", "Profesor", "Pisarz", "Malarz", "Aktor", "Reżyser", "Muzyk", "Śpiewak", "Tancerz",
            "Kucharz", "Kelner", "Fryzjer", "Krawiec", "Mechanik", "Górnik", "Rolnik", "Wędkarz", "Żeglarz", "Turysta",
            "Sąsiad", "Przyjaciel", "Wróg", "Rywal", "Sędzia", "Adwokat", "Świadek", "Złodziej", "Rycerz", "Czołg",
            "Rakieta", "Radar", "Antena", "Satelita", "Kosmos", "Planeta", "Kometa", "Meteor", "Jaskinia", "Wulkan",
            "Wodospad", "Bagno", "Puszcza", "Dżungla", "Pustynia", "Dolina", "Wzgórze", "Skała", "Przepaść", "Wybrzeże",
            "Zatoka", "Kanał", "Port", "Lotnisko", "Dworzec", "Przystanek", "Skrzyżowanie", "Chodnik", "Autostrada", "Tunel",
            "Wiadukt", "Rondo", "Parking", "Garaż", "Piwnica", "Strych", "Korytarz", "Pokój", "Kuchnia", "Łazienka",
            "Biuro", "Magazyn", "Fabryka", "Kopalnia", "Huta", "Warsztat", "Budowa", "Dźwig", "Koparka", "Traktor",
            "Przyczepa", "Ciężarówka", "Taksówka", "Tramwaj", "Metro", "Rower", "Hulajnoga", "Motocykl", "Kask", "Ochroniarz"
        ];

        // Obsługa konfiguracji
        function setGameMode(mode) {
            gameMode = mode;
            document.getElementById('mode-team-btn').classList.toggle('active', mode === 'team');
            document.getElementById('mode-ind-btn').classList.toggle('active', mode === 'individual');
            
            const input = document.getElementById('player-input');
            input.placeholder = mode === 'team' ? "Nazwa drużyny..." : "Imię gracza...";
        }

        function addParticipant() {
            const input = document.getElementById('player-input');
            const name = input.value.trim();
            
            if (name) {
                participants.push({ name: name, score: 0 });
                input.value = '';
                renderSetupList();
            }
        }

        function removeParticipant(index) {
            participants.splice(index, 1);
            renderSetupList();
        }

        function renderSetupList() {
            const listEl = document.getElementById('setup-participant-list');
            listEl.innerHTML = '';
            
            participants.forEach((p, index) => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <span>${p.name}</span>
                    <button class="btn-remove" onclick="removeParticipant(${index})">&times;</button>
                `;
                listEl.appendChild(li);
            });
        }

        function confirmSetup() {
            if (participants.length === 0) {
                alert(gameMode === 'team' ? "Dodaj przynajmniej jedną drużynę!" : "Dodaj przynajmniej jednego gracza!");
                return;
            }

            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
            document.getElementById('scoreboard-panel').classList.remove('hidden');
            
            renderScoreboard();
        }

        // Obsługa Punktacji
        function updateScore(index, delta) {
            participants[index].score += delta;
            renderScoreboard();
        }

        function renderScoreboard() {
            const listEl = document.getElementById('scoreboard-list');
            listEl.innerHTML = '';

            participants.forEach((p, index) => {
                const item = document.createElement('div');
                item.className = 'score-item';
                item.innerHTML = `
                    <span class="score-name">${p.name}</span>
                    <div class="score-controls">
                        <button class="btn-score btn-minus" onclick="updateScore(${index}, -1)">-</button>
                        <span class="score-val">${p.score}</span>
                        <button class="btn-score btn-plus" onclick="updateScore(${index}, 1)">+</button>
                    </div>
                `;
                listEl.appendChild(item);
            });
        }

        // Logika Gry
        function getRandomWords() {
            const shuffled = [...wordList].sort(() => 0.5 - Math.random());
            return `${shuffled[0]} - ${shuffled[1]}`;
        }

        function startProcess() {
            clearInterval(countdownInterval);

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-area').classList.remove('hidden');

            document.getElementById('words').textContent = getRandomWords();

            let prepareTime = 3;
            const timerEl = document.getElementById('timer');
            const labelEl = document.getElementById('timer-label');
            
            labelEl.textContent = "Zapoznaj się ze słowami:";
            timerEl.textContent = prepareTime;
            
            playBeep();

            countdownInterval = setInterval(() => {
                prepareTime--;
                timerEl.textContent = prepareTime;

                if (prepareTime > 0) {
                    playBeep();
                } else {
                    clearInterval(countdownInterval);
                    startMainTimer();
                }
            }, 1000);
        }

        function startMainTimer() {
            let mainTime = 45;
            const timerEl = document.getElementById('timer');
            const labelEl = document.getElementById('timer-label');

            labelEl.textContent = "Czas gry:";
            timerEl.textContent = mainTime;

            countdownInterval = setInterval(() => {
                mainTime--;
                timerEl.textContent = mainTime;

                if (mainTime <= 0) {
                    clearInterval(countdownInterval);
                    labelEl.textContent = "Czas minął!";
                    timerEl.textContent = "STOP";
                    playBell();
                }
            }, 1000);
        }

        function endGame() {
            clearInterval(countdownInterval);
            document.getElementById('game-area').classList.add('hidden');
            document.getElementById('scoreboard-panel').classList.add('hidden');
            document.getElementById('setup-screen').classList.remove('hidden');
            
            // Reset stanu
            participants = [];
            renderSetupList();
        }
    </script>
</body>
</html>
